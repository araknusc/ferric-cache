[package]
name = "ferric-cache"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "A high-performance, multi-core-sharded, RESP-compatible cache server in Rust"
license = "Apache-2.0"
repository = "https://github.com/araknusc/ferric-cache"
homepage = "https://github.com/araknusc/ferric-cache"
readme = "README.md"
keywords = ["cache", "redis", "resp", "key-value", "database"]
categories = ["caching", "database-implementations", "network-programming"]
authors = ["chaitu.sunkara@gmail.com"]

[lib]
name = "ferric_cache"
path = "src/lib.rs"

[[bin]]
name = "ferric-cache"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
bytes = { version = "1.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.3"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
tokio-rustls = "0.25"
rustls = "0.22"
rustls-pemfile = "2.0"
bincode = "1.3"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
sha1 = "0.10"
argon2 = "0.5"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "performance"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
